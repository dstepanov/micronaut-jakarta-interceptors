name: GraalVM Native Tests
on:
  push:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
jobs:
  nativeTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21']
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # the suite declares no reachability metadata: an interception that reached for reflection would fail here
      - name: Run the tests in a native image
        run: ./gradlew :test-suite-graalvm:nativeTest --no-daemon
