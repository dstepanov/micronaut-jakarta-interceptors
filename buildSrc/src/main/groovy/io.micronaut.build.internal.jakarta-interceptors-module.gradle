plugins {
    id 'io.micronaut.build.internal.jakarta-interceptors-base'
    id 'io.micronaut.build.internal.module'
    id 'io.micronaut.build.internal.convention-nullaway'
    id 'io.micronaut.errorprone.no-reflection'
}

micronautBuild {
    // there is no released version to compare against yet
    binaryCompatibility {
        enabled = false
    }
}

// The interception never reflects, and the NoReflection check of micronaut-projects/errorprone-no-reflection holds
// what this module publishes to that.
//
// Only the main sources are checked. The tests are free to reflect: a test that proves an interception reached a
// member without reflecting has to reach it somehow.
noReflection {
    // the ErrorProne the check runs in is the one NullAway runs in
    errorProneVersion = libs.versions.error.prone.core
}

dependencies {
    testRuntimeOnly(libs.junit.platform.launcher)
}
