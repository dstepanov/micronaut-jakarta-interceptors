// The ErrorProne check that forbids reading the annotations of a class through the class. It is a build tool
// rather than a module of the library: it is not published, and nothing depends on it at runtime.
//
// Checkstyle cannot do this one. config/reflection/checkstyle-no-reflection.xml forbids the receivers it can
// recognise by their spelling - a class literal, getClass() - and says so; a receiver held in a Class variable
// reads exactly like a call on the AnnotationMetadata Micronaut compiled. Telling those apart needs the type of
// the receiver, which is what ErrorProne resolves and a regular expression cannot.
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly libs.error.prone.core
    compileOnly "com.google.auto.service:auto-service-annotations:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor libs.error.prone.core
}

// a check is written against the compiler of the platform, whose packages are not exported
def compilerExports = [
    'api', 'code', 'file', 'main', 'model', 'parser', 'processing', 'tree', 'util'
].collectMany { ["--add-exports", "jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()] as List<String> }

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(compilerExports)
}
