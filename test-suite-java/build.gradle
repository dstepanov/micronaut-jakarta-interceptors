plugins {
    id "io.micronaut.build.internal.jakarta-interceptors-native-test-suite"
}

dependencies {
    testAnnotationProcessor platform(libs.micronaut.core)
    testAnnotationProcessor projects.micronautJakartaInterceptorsProcessor
    testAnnotationProcessor mn.micronaut.inject.java
    // turns the @ReflectiveAccess and @ReflectionConfig the processor declares into the reachability metadata of the image
    testAnnotationProcessor mn.micronaut.graal

    testImplementation platform(libs.micronaut.core)
    testImplementation projects.micronautJakartaInterceptors
    testImplementation mn.micronaut.core
    testImplementation mn.micronaut.inject
    testImplementation mn.micronaut.aop
    testImplementation mn.micronaut.context

    testAnnotationProcessor libs.jakarta.cdi.api
    testImplementation libs.jakarta.cdi.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.jupiter.engine
}

// Interceptor classes compiled without the Jakarta Interceptors processor, with Micronaut's own processor alone, as a
// module built by someone who left it off would be. They are what an interceptor class the runtime cannot read looks
// like, and the tests hold the runtime to reporting one rather than leaving it out of a chain
sourceSets {
    external {
        java.srcDir 'src/external/java'
    }
}

dependencies {
    externalAnnotationProcessor platform(libs.micronaut.core)
    externalAnnotationProcessor mn.micronaut.inject.java
    externalImplementation platform(libs.micronaut.core)
    externalImplementation mn.micronaut.inject
    externalImplementation libs.managed.jakarta.interceptor.api
    externalImplementation libs.managed.jakarta.annotation.api

    testImplementation sourceSets.external.output
}
